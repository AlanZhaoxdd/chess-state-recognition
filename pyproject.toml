[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chessrec"
version = "0.1.0"
description = "Chess game state recognition from a single image (COMP3204 coursework 2)"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["chessrec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
